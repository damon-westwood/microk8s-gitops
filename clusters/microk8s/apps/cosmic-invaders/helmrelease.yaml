apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cosmic-invaders
  namespace: flux-system
spec:
  interval: 5m
  releaseName: cosmic-invaders
  targetNamespace: cosmic
  install:
    createNamespace: true
  chart:
    spec:
      chart: cosmic-invaders
      version: "2.2.0"
      sourceRef:
        kind: HelmRepository
        name: cosmic-museum
        namespace: flux-system
      interval: 5m
  valuesFrom:
    - kind: ConfigMap
      name: cosmic-invaders-values
      valuesKey: values.yaml

